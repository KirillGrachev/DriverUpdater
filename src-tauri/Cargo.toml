[package]
name = "driver-updater"
version = "1.0.1"
description = "Driver Updater - free open-source driver manager (Tauri core)"
authors = ["Kirill Grachev <https://github.com/KirillGrachev>"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "driver_updater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
sha2 = "0.11"
sys-locale = "0.3"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
