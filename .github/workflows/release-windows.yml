name: Release Windows

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-windows:
        name: Windows ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        env:
            HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-pc-windows-msvc
                      arch: x64
                      msvc: x64
                      runner: windows-latest
                    - target: aarch64-pc-windows-msvc
                      arch: arm64
                      msvc: arm64
                      runner: windows-11-arm
                    - target: i686-pc-windows-msvc
                      arch: x86
                      msvc: x86
                      runner: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 22
                  cache: npm
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  targets: ${{ matrix.target }}
            - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
              with:
                  arch: ${{ matrix.msvc }}
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  workspaces: src-tauri
                  key: ${{ matrix.target }}
            - name: Check tag version
              if: startsWith(github.ref, 'refs/tags/')
              shell: pwsh
              run: |
                  $version = (Get-Content package.json | ConvertFrom-Json).version
                  if ("v$version" -ne "${{ github.ref_name }}") {
                    throw "Tag ${{ github.ref_name }} does not match package version $version"
                  }
            - name: Install dependencies
              run: npm ci
            - name: Configure Authenticode signing
              if: env.HAS_SIGNING_CERT == 'true'
              shell: pwsh
              env:
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
                  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
              run: |
                  $pfx = Join-Path $env:RUNNER_TEMP "driver-updater.pfx"
                  try {
                    [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
                    $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
                    $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
                  } finally {
                    Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
                  }
                  if (-not $certificate -or -not $certificate.HasPrivateKey) {
                    throw "The imported certificate does not contain a private key"
                  }
                  @{
                    bundle = @{
                      windows = @{
                        certificateThumbprint = $certificate.Thumbprint
                        digestAlgorithm = "sha256"
                        timestampUrl = "http://timestamp.digicert.com"
                      }
                    }
                  } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:RUNNER_TEMP "signing.json")
                  "TAURI_SIGNING_CONFIG=$(Join-Path $env:RUNNER_TEMP 'signing.json')" >> $env:GITHUB_ENV
            - name: Build installers
              shell: pwsh
              run: |
                  $arguments = @("run", "tauri", "--", "build", "--target", "${{ matrix.target }}", "--bundles", "msi", "nsis")
                  if ($env:TAURI_SIGNING_CONFIG) { $arguments += @("--config", $env:TAURI_SIGNING_CONFIG) }
                  npm @arguments
            - name: Smoke test the MSI payload
              if: matrix.arch == 'x64'
              shell: pwsh
              run: ./scripts/smoke-msi.ps1 -BundleDir "src-tauri/target/${{ matrix.target }}/release/bundle/msi"
            - name: Smoke test the NSIS payload
              if: matrix.arch == 'x64'
              shell: pwsh
              env:
                  CI: 'true'
              run: ./scripts/smoke-nsis.ps1 -BundleDir "src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
            - name: Package portable and symbols
              shell: pwsh
              run: ./scripts/package-windows.ps1 -Target ${{ matrix.target }} -Version ${{ github.ref_name }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: windows-${{ matrix.arch }}
                  path: artifacts/windows-${{ matrix.arch }}
                  if-no-files-found: error

    setup-wizard:
        name: Setup wizard ${{ matrix.arch }}
        needs: [build-windows]
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-pc-windows-msvc
                      arch: x64
                      msvc: x64
                      runner: windows-latest
                    - target: aarch64-pc-windows-msvc
                      arch: arm64
                      msvc: arm64
                      runner: windows-11-arm
                    - target: i686-pc-windows-msvc
                      arch: x86
                      msvc: x86
                      runner: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 22
                  cache: npm
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  targets: ${{ matrix.target }}
            - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
              with:
                  arch: ${{ matrix.msvc }}
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  workspaces: installer/src-tauri
                  key: setup-${{ matrix.target }}
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: windows-${{ matrix.arch }}
                  path: artifacts/windows-${{ matrix.arch }}
            - name: Build the unified setup wizard
              shell: pwsh
              run: ./scripts/build-setup.ps1 -Target ${{ matrix.target }} -BundleRoot "artifacts/windows-${{ matrix.arch }}" -Version "${{ github.ref_name }}"
            - name: Name the architecture setup executable
              shell: pwsh
              run: Copy-Item "artifacts/setup/${{ matrix.arch }}/DriverUpdaterSetup.exe" "artifacts/setup/DriverUpdaterSetup-${{ matrix.arch }}.exe"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: setup-${{ matrix.arch }}
                  path: artifacts/setup
                  if-no-files-found: error

    sbom:
        name: Software bill of materials
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 22
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Generate CycloneDX SBOM
              run: |
                  mkdir -p artifacts/sbom
                  npm sbom --sbom-format cyclonedx > artifacts/sbom/npm.cdx.json
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: sbom
                  path: artifacts/sbom
                  if-no-files-found: error

    publish:
        name: Publish release
        needs: [build-windows, setup-wizard, sbom]
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
            - name: Generate release notes
              shell: bash
              run: |
                  previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^")
                  node scripts/release-notes.mjs --from "$previous" --to "$GITHUB_REF_NAME" --output release-notes.md
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  pattern: '*'
                  path: artifacts
            - name: Keep only the unified installers
              shell: bash
              run: |
                  # Raw MSI/NSIS payloads are already inside the setup ZIP. Do
                  # not publish their native UIs as separate user-facing assets.
                  find artifacts -type f \( -name '*.msi' -o -name '*-setup.exe' \) -delete
                  find artifacts -type f -name 'SHA256SUMS*' -delete
            - name: Regenerate checksums
              shell: bash
              run: |
                  cd artifacts
                  find . -type f ! -name 'SHA256SUMS*' -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS.txt
            - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
              with:
                  files: artifacts/**
                  body_path: release-notes.md
                  generate_release_notes: false
