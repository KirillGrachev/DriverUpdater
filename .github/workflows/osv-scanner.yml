name: OSV Scanner

on:
    push:
        branches: [main]
    schedule:
        - cron: '30 6 * * 1'
    workflow_dispatch:

permissions:
    actions: read
    contents: read
    security-events: write

jobs:
    scan:
        name: Scan dependency lockfiles
        uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
            scan-args: |-
                --lockfile=./package-lock.json
                --lockfile=./src-tauri/Cargo.lock
                --lockfile=./installer/src-tauri/Cargo.lock
                --lockfile=./portable/Cargo.lock
            fail-on-vuln: false
            upload-sarif: true
        permissions:
            actions: read
            contents: read
            security-events: write
