<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/src/assets/branding/logo.png" />
        <title>Driver Updater</title>
        <script>
            (function () {
                var theme = 'light';
                try {
                    var stored = localStorage.getItem('driver-updater.theme');
                    if (stored === 'dark' || stored === 'light') theme = stored;
                    else if (stored === 'system' || !stored) {
                        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                    }
                } catch {
                    /** localStorage can be unavailable in hardened webviews. */
                }
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            })();
        </script>
        <style>
            :root {
                --boot-bg: #f7f8fe;
                --boot-primary: #1f6df8;
                --boot-primary-soft: #e8f0fe;
                --boot-border: #e5eaf5;
                --boot-text: #0b1220;
            }

            html[data-theme='dark'] {
                --boot-bg: #0b101b;
                --boot-primary: #4d90ff;
                --boot-primary-soft: #17273f;
                --boot-border: #253048;
                --boot-text: #e8edf6;
            }

            html,
            body,
            #root {
                height: 100%;
                margin: 0;
                background: var(--boot-bg);
            }

            body {
                font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
            }

            #boot-static {
                position: fixed;
                inset: 0;
                z-index: 80;
                display: grid;
                place-items: center;
                background: var(--boot-bg);
                color: var(--boot-text);
                transition:
                    opacity 0.22s ease,
                    visibility 0.22s ease;
            }

            #boot-static.is-leaving {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            .boot-static-inner {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
            }

            .boot-static-mark {
                display: grid;
                place-items: center;
                width: 82px;
                height: 82px;
                border-radius: 20px;
                background: var(--boot-primary-soft);
            }

            .boot-static-mark img {
                width: 58px;
                height: 58px;
                object-fit: contain;
            }

            .boot-static-copy strong {
                font-size: 22px;
                font-weight: 700;
                letter-spacing: -0.3px;
            }

            .boot-static-bar {
                width: 180px;
                height: 4px;
                overflow: hidden;
                border-radius: 99px;
                background: var(--boot-border);
            }

            .boot-static-bar i {
                display: block;
                width: 42%;
                height: 100%;
                border-radius: inherit;
                background: var(--boot-primary);
                animation: boot-static-slide 1.1s ease-in-out infinite;
            }

            @keyframes boot-static-slide {
                0% {
                    transform: translateX(-110%);
                }
                100% {
                    transform: translateX(360%);
                }
            }
        </style>
    </head>
    <body>
        <div id="boot-static" role="status" aria-live="polite" aria-label="Loading">
            <div class="boot-static-inner">
                <div class="boot-static-mark">
                    <img src="/src/assets/branding/logo.png" alt="" aria-hidden="true" draggable="false" />
                </div>
                <div class="boot-static-copy"><strong>Driver Updater</strong></div>
                <div class="boot-static-bar" aria-hidden="true"><i></i></div>
            </div>
        </div>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
