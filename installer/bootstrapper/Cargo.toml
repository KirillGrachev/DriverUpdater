[package]
name = "driver-updater-bootstrapper"
version = "1.1.2"
description = "Native preflight for the Driver Updater setup wizard"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "driver-updater-bootstrapper"
path = "src/main.rs"
